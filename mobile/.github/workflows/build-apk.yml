name: Build APK
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: "22"}
   - uses: actions/setup-java@v4
     with: {distribution: "temurin", java-version: "21"}
   - run: cd mobile && npm install && npm run build && npx cap add android && npx cap sync android
   - run: cd mobile/android && ./gradlew assembleDebug
   - uses: actions/upload-artifact@v4
     with: {name: ForexSense-v2-APK, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk}
